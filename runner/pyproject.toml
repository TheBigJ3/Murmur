[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murmur-runner"
# Kept in sync with ../VERSION by scripts/release.sh; do not edit by hand.
version = "0.0.0"
description = "Locust runner that swarms an API along a Murmur Markov load graph."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "locust",
    "python-jsonpath",
]

[tool.hatch.build.targets.wheel]
packages = ["murmur_runner"]
